name: Build

# Builds mt4g for AMD and NVIDIA as described in the README and runs --help/--version
# (the runners have no GPU). Per vendor: "minimum" = oldest supported toolkit in a
# pinned container, "latest" = newest toolkit from the vendor's apt repo (unpinned,
# so it breaks when a new release breaks mt4g; that is intended).
# CUDA 13 needs HIP >= 7.2 and dropped architectures older than sm_75.
on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
permissions:
  contents: read
# a new push cancels the still running CI of the older commit
# master and develop get a group per commit, so there every commit is tested
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') && github.sha || github.ref }}
  cancel-in-progress: true
env:
  CXXOPTS_VERSION: v3.2.0  # minimum required by CMakeLists.txt; Ubuntu 24.04 ships 3.1.1
  DEBIAN_FRONTEND: noninteractive
jobs:
  amd:
    name: amd-rocm${{ matrix.rocm }}-${{ matrix.gpu }}-${{ matrix.arch }}
    # PRs from branches of this repository are already built by their push
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rocm: "6.3.3",  gpu: mi200, arch: gfx90a, container: "rocm/dev-ubuntu-24.04:6.3.3" }  # gfx90a also covers the gfx90a/gfx908-only code
          - { rocm: "latest", gpu: mi300, arch: gfx942, container: "" }
    steps:
      # git before checkout, otherwise there is no .git and --version has no git version
      - name: Get build tools
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends git cmake make g++ pkg-config \
            ca-certificates curl gnupg libdrm-dev nlohmann-json3-dev
      - name: Add ROCm apt repository
        if: matrix.rocm == 'latest'
        run: |
          . /etc/os-release
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.radeon.com/rocm/rocm.gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/rocm.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/latest $VERSION_CODENAME main" \
            | sudo tee /etc/apt/sources.list.d/rocm.list
          printf 'Package: *\nPin: release o=repo.radeon.com\nPin-Priority: 600\n' | sudo tee /etc/apt/preferences.d/rocm-pin-600
          sudo apt-get update
      - name: Get dependencies
        run: |
          SUDO=$(command -v sudo || true)
          # rocm-device-libs is only recommended by rocm-llvm, but needed to compile HIP
          $SUDO apt-get install -y --no-install-recommends hip-dev hip-runtime-amd rocm-device-libs rocm-smi-lib hsa-rocr-dev
          git clone --depth 1 --branch "$CXXOPTS_VERSION" https://github.com/jarro2783/cxxopts.git /tmp/cxxopts
          cmake -S /tmp/cxxopts -B /tmp/cxxopts/build -DCXXOPTS_BUILD_EXAMPLES=OFF -DCXXOPTS_BUILD_TESTS=OFF
          $SUDO cmake --install /tmp/cxxopts/build
          echo "HIP_PATH=/opt/rocm" >> "$GITHUB_ENV"
          echo "/opt/rocm/bin" >> "$GITHUB_PATH"
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags for `git describe` in --version
          persist-credentials: false
      - name: Configure
        run: mkdir build && cd build && cmake .. -DGPU_TARGET_ARCH=${{ matrix.arch }} -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/mt4g"
      - name: Build
        run: make -C build all -j "$(nproc)"
      - name: Install
        run: make -C build install
      - name: Run
        run: |
          "$RUNNER_TEMP/mt4g/bin/mt4g" --help
          "$RUNNER_TEMP/mt4g/bin/mt4g" --version

  nvidia:
    name: nvidia-cuda${{ matrix.cuda }}-hip${{ matrix.hip }}-${{ matrix.gpu }}-${{ matrix.arch }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cuda: "12.8.1", hip: "6.3.3",  gpu: pascal, arch: sm_60, container: "nvidia/cuda:12.8.1-devel-ubuntu24.04" }  # oldest supported
          - { cuda: "latest", hip: "latest", gpu: hopper, arch: sm_90, container: "" }
    env:
      HIP_PLATFORM: nvidia
    steps:
      - name: Get build tools
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends git cmake make g++ \
            ca-certificates curl gnupg nlohmann-json3-dev
          git clone --depth 1 --branch "$CXXOPTS_VERSION" https://github.com/jarro2783/cxxopts.git /tmp/cxxopts
          cmake -S /tmp/cxxopts -B /tmp/cxxopts/build -DCXXOPTS_BUILD_EXAMPLES=OFF -DCXXOPTS_BUILD_TESTS=OFF
          $SUDO cmake --install /tmp/cxxopts/build
      - name: Get CUDA
        if: matrix.cuda == 'latest'
        run: |
          . /etc/os-release
          curl -fsSLo /tmp/cuda-keyring.deb "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu${VERSION_ID//./}/x86_64/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cuda-toolkit
      # only the HIP headers (hip-dev) and hipcc (hipcc-nvidia) are unpacked: installing
      # them with apt would pull in the AMD runtime and the NVIDIA driver
      - name: Get HIP
        run: |
          SUDO=$(command -v sudo || true)
          . /etc/os-release
          $SUDO mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.radeon.com/rocm/rocm.gpg.key | $SUDO gpg --dearmor -o /etc/apt/keyrings/rocm.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/${{ matrix.hip }} $VERSION_CODENAME main" \
            | $SUDO tee /etc/apt/sources.list.d/rocm.list
          $SUDO apt-get update
          cd /tmp && apt-get download hip-dev hipcc-nvidia
          for deb in /tmp/hip-dev_*.deb /tmp/hipcc-nvidia_*.deb; do $SUDO dpkg-deb -x "$deb" /; done
          ROCM_PATH=$(ls -d /opt/rocm-* | sort -V | tail -1)
          echo "HIP_PATH=$ROCM_PATH" >> "$GITHUB_ENV"
          # hipcc < 7 does not pass the HIP include dir to nvcc (Spack patches this)
          echo "CPLUS_INCLUDE_PATH=$ROCM_PATH/include" >> "$GITHUB_ENV"
          echo "CUDA_PATH=/usr/local/cuda" >> "$GITHUB_ENV"
          echo "$ROCM_PATH/bin" >> "$GITHUB_PATH"
          echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags for `git describe` in --version
          persist-credentials: false
      - name: Configure
        run: mkdir build && cd build && cmake .. -DGPU_TARGET_ARCH=${{ matrix.arch }} -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/mt4g"
      - name: Build
        run: make -C build all -j "$(nproc)"
      - name: Install
        run: make -C build install
      # mt4g links libcuda.so.1 (driver), which the runner lacks; the stub is enough
      # because --help/--version exit before any CUDA call
      - name: Run
        run: |
          mkdir -p /tmp/cuda-stub
          ln -sf /usr/local/cuda/lib64/stubs/libcuda.so /tmp/cuda-stub/libcuda.so.1
          export LD_LIBRARY_PATH=/tmp/cuda-stub:${LD_LIBRARY_PATH:-}
          "$RUNNER_TEMP/mt4g/bin/mt4g" --help
          "$RUNNER_TEMP/mt4g/bin/mt4g" --version
